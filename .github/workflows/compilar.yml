name: Compilar SparkTraderBot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Buildozer y Gradle
        uses: actions/cache@v4
        with:
          path: |
           .buildozer
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v3
          restore-keys: |
            buildozer-

      - name: Instalar dependencias sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev lld

      - name: Instalar Buildozer
        run: |
          pip install --upgrade pip
          pip install "cython<3.0,>=0.29.33" buildozer

      - name: Aceptar licencias Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platform-tools" "platforms;android-33"

      - name: Compilar APK
        run: |
          rm -rf bin
          buildozer -v android debug
        env:
          P4A_ACCEPT_SDK_LICENSE_AGREEMENT: "y"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: TraderBot-APK
          path: bin/*.apk
