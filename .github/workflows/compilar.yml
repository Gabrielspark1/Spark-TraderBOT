name: Compilar SparkTraderBot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev lld
          pip install --upgrade pip
          pip install "cython<3.0,>=0.29.33" buildozer

      - name: Aceptar licencias y parchear SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;30.0.3" "platform-tools" "platforms;android-33" "platforms;android-30"

          mkdir -p ~/.buildozer/android/platform/android-sdk/
          
          rm -rf ~/.buildozer/android/platform/android-sdk/build-tools
          rm -rf ~/.buildozer/android/platform/android-sdk/platform-tools
          rm -rf ~/.buildozer/android/platform/android-sdk/platforms
          rm -rf ~/.buildozer/android/platform/android-sdk/cmdline-tools
          rm -rf ~/.buildozer/android/platform/android-sdk/tools
          
          ln -sf $ANDROID_HOME/build-tools ~/.buildozer/android/platform/android-sdk/build-tools
          ln -sf $ANDROID_HOME/platform-tools ~/.buildozer/android/platform/android-sdk/platform-tools
          ln -sf $ANDROID_HOME/platforms ~/.buildozer/android/platform/android-sdk/platforms
          ln -sf $ANDROID_HOME/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools
          
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager

      - name: Compilar APK
        run: |
          rm -rf bin
          buildozer -v android debug
        env:
          P4A_ACCEPT_SDK_LICENSE_AGREEMENT: "y"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: TraderBot-APK
          path: bin/*.apk
