name: Compilar SparkTraderBot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar herramientas del sistema
        run: |
          sudo apt update -y
          sudo apt install -y \
            git python3-pip build-essential libssl-dev libffi-dev \
            python3-dev python3-venv libncurses5-dev libncursesw5-dev \
            cmake libsqlite3-dev libbz2-dev libreadline-dev \
            liblzma-dev zlib1g-dev libpng-dev libfreetype6-dev \
            zip unzip auto-apt-proxy

      - name: Instalar Buildozer y Cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install cython==0.29.33 buildozer==1.5.0

      - name: Compilar APK (Buildozer descarga SDK/NDK)
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE="y"
          python3 -m buildozer android release

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: SparkTraderBot-APK
          path: bin/*.apk
          retention-days: 7
