name: Compilar SparkTraderBot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar herramientas completas del sistema
        run: |
          sudo apt update -y
          sudo apt install -y \
            git python3-pip build-essential libssl-dev libffi-dev \
            python3-dev python3-venv libncurses5-dev libncursesw5-dev \
            cmake libsqlite3-dev libbz2-dev libreadline-dev \
            liblzma-dev zlib1g-dev libpng-dev libfreetype6-dev \
            zip unzip auto-apt-proxy ccache patch pkg-config \
            autoconf automake libtool gperf

      - name: Configurar Cache de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Instalar Buildozer y Cython Actualizados
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "cython<3.0.0" buildozer==1.5.1

      - name: Compilar APK (Buildozer descarga SDK/NDK)
        run: |
          export BUILDOZER_ACCEPT_ANDROID_SDK_LICENSE="True"
          export APP_ANDROID_ACCEPT_SDK_LICENSE="True"
          python3 -m buildozer android release

      - name: Subir APK generada
        uses: actions/upload-artifact@v4
        with:
          name: SparkTraderBot-APK
          path: bin/*.apk
          retention-days: 7
