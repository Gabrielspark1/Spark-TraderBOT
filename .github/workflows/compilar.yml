name: Compilar SparkTraderBot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git libffi-dev libssl-dev autoconf automake build-essential ccache libtool pkg-config python3-dev python3-pip python3-setuptools zip zlib1g-dev

      - name: Obtener fecha actual (para el caché)
        id: get-date
        run: echo "date=$(date -u +'%Y%m%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Caché de dependencias globales de Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Caché del directorio de compilación
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-${{ steps.get-date.outputs.date }}-${{ hashFiles('buildozer.spec') }}

      - name: Compilar con Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Subir APK generado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SparkTraderBot-APK
          path: ${{ steps.buildozer.outputs.filename }}


      - name: Notificar en caso de error
        if: failure()
        run: echo "❌ La compilación falló"
